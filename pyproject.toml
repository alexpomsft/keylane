[project]
name = "keylane"
version = "0.1.0"
description = "Keyboard-first KeePass-compatible password manager for Linux/Wayland (Hyprland/Omarchy)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.6",
  "pykeepass>=4.1,<5",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
keylane = "keylane.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keylane*"]

[tool.setuptools.package-data]
"keylane" = ["ui/qml/*.qml", "ui/qml/*/*.qml", "ui/qml/qmldir", "data/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
